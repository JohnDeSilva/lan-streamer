[project]
name = "lan-streamer"
version = "0.50.0rc3"
description = "Lightweight media library manager for local playback with Jellyfin synchronization"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.11.1",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.18.5",
    "python-vlc>=3.0.0",
    "pytest-timeout>=2.4.0",
    "cryptography>=50.0.0",
    "qasync>=0.27.0",
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
    "commitizen>=4.17.0",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "types-requests>=2.33.0.20260712",
    "pytest-xdist>=3.6.1",
    "vulture>=2.16",
]
[project.scripts]
lan-streamer = "lan_streamer.main:run_main"
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=lan_streamer --cov-report=term-missing"
filterwarnings = ["error", "ignore::ResourceWarning"]
markers = [
    "load: marks tests as load/performance tests (skipped by default)"
]
timeout = 30
timeout_method = "thread"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.50.0rc3"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:version",
    "src/lan_streamer/__init__.py"
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
disable_error_code = ["method-assign", "return-value", "var-annotated", "no-redef"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "lan_streamer.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["INP001"]
"alembic/**/*.py" = ["INP001"]
".github/**/*.py" = ["INP001"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "BLE", "TRY400", "TRY401", "TRY201", "TRY002", "TRY203", "DTZ", "S110", "S112", "RUF", "PLC0206", "PLC0207", "PLR0402", "PLR1714", "PLR1730", "PLR5501", "PLW0108", "PLW0603", "PLW1510", "PLW2901", "B", "C4", "PIE", "RSE", "FURB", "ASYNC109", "ASYNC110", "ASYNC230", "ASYNC240", "LOG", "PYI", "RET", "W", "ISC", "PGH", "TID", "T10", "A", "C90", "ERA", "EXE", "FA", "FLY", "IC", "INP", "INT", "NPY", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PT", "Q", "SLOT", "TCH", "TD", "TYP", "YTT"]

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 30
max-positional-args = 10
max-returns = 8
max-statements = 100

[tool.ruff.lint.mccabe]
max-complexity = 30
