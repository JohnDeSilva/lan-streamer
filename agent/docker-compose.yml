services:
  scan-agent:
    image: lan-streamer-agent:latest
    build:
      context: ..
      dockerfile: agent/Dockerfile
    container_name: lan-streamer-remote-agent
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - HOME=/root
      - SCAN_AGENT_CONFIG=/data/config.json
    volumes:
      - ${SRC_ROOT:-../src}:/app/src:ro,z
      - ${AGENT_SRC_ROOT:-./src}:/app/agent/src:ro,z
      - ${MEDIA_ROOT:-./media}:/media:ro,z
      - ${DATA_ROOT:-./data}:/data:Z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
