name: Test

on:
  workflow_call:

jobs:
  check-source-branch:
    name: Enforce Merge from rc to main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Verify source branch
        env:
          PR_TARGET_BRANCH: ${{ github.base_ref }}
          PR_SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "PR target branch: $PR_TARGET_BRANCH"
          echo "PR source branch: $PR_SOURCE_BRANCH"
          if [[ "$PR_SOURCE_BRANCH" != rc* ]] && [[ "$PR_SOURCE_BRANCH" != "dependabot-base" ]]; then
            echo "ERROR: Only pull requests from an 'rc*' branch or 'dependabot-base' are allowed to target 'main'!"
            exit 1
          fi

  # Desktop (containerized) test suites -------------------------------------------------
  test-desktop-ubuntu:
    name: Test Desktop (Ubuntu)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run desktop unit tests with coverage check
        run: TEST_OS=ubuntu make test-desktop

      - name: Validate executable runs
        run: TEST_OS=ubuntu make validate-executable

  test-desktop-fedora:
    name: Test Desktop (Fedora)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run desktop unit tests
        run: TEST_OS=fedora make test-desktop

      - name: Validate executable runs
        run: TEST_OS=fedora make validate-executable

  # Agent (containerized) test suites ---------------------------------------------------
  test-agent-back:
    name: Test Agent Backend
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run agent backend tests with coverage check (containerized)
        run: make test-agent-back

  test-agent-front:
    name: Test Agent Frontend (SPA JavaScript)
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run agent frontend JS tests (containerized)
        run: make test-agent-front
